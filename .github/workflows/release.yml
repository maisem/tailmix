name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, tailmix-vm]
    container:
      image: golang:1.26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check
      - name: Install GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.12.7
      - name: Release
        run: goreleaser release --clean --parallelism 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
