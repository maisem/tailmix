name: licenses

on:
  pull_request:
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - Makefile
      - licenses/**
      - scripts/licenses.sh
      - .github/workflows/licenses.yml
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - Makefile
      - licenses/**
      - scripts/licenses.sh
      - .github/workflows/licenses.yml
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, tailmix-vm]
    container:
      image: golang:1.26
    steps:
      - uses: actions/checkout@v6
      - run: make licenses-check
