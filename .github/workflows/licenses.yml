name: licenses

on:
  pull_request:
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - Makefile
      - licenses/**
      - scripts/licenses.sh
      - .github/workflows/licenses.yml
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - Makefile
      - licenses/**
      - scripts/licenses.sh
      - .github/workflows/licenses.yml
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make licenses-check
